services:
  postgres:
    image: postgres:16-alpine
    container_name: myaccount-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-myaccount}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/script.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-myaccount}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
